<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>卡片属性编辑器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-section {
            background: #f8f9fa;
            border: 2px dashed #6c757d;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .auth-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }
        .auth-controls input {
            flex: 1;
            max-width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .auth-controls button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .auth-controls button:hover {
            background: #0056b3;
        }
        .auth-controls button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        .auth-status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        .auth-status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .auth-status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .main-content {
            display: none;
        }
        .main-content.authenticated {
            display: block;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-top: 20px;
        }
        .controls {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            height: fit-content;
        }
        .preview {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .card-preview {
            width: 300px;
            height: 400px;
            background: white;
            border-radius: 15px;
            margin: 0 auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-group h3 {
            margin-bottom: 10px;
            color: #333;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .control-group input, .control-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>音撃風卡面预览器</h1>
            <p>编辑和预览您的卡片设计</p>
        </div>

        <div class="auth-section">
            <h3>🔐 身份验证</h3>
            <p>请输入您的Ntoken以访问卡片编辑功能</p>
            <div class="auth-controls">
                <input id="token-input" type="password" placeholder="输入您的Ntoken">
                <button id="verify-btn">验证</button>
            </div>
            <div id="auth-status" class="auth-status" style="display: none;"></div>
        </div>

        <div class="main-content" id="main-content">
            <div class="grid">
                <div class="controls">
                    <div class="control-group">
                        <h3>基本信息</h3>
                        <label for="card-name">卡片名称:</label>
                        <input type="text" id="card-name" value="示例卡片">
                        
                        <label for="card-type">卡片类型:</label>
                        <select id="card-type">
                            <option value="normal">普通</option>
                            <option value="rare">稀有</option>
                            <option value="epic">史诗</option>
                            <option value="legendary">传说</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <h3>属性设置</h3>
                        <label for="attack">攻击力:</label>
                        <input type="number" id="attack" value="100" min="0" max="999">
                        
                        <label for="defense">防御力:</label>
                        <input type="number" id="defense" value="80" min="0" max="999">
                        
                        <label for="speed">速度:</label>
                        <input type="number" id="speed" value="90" min="0" max="999">
                    </div>

                    <div class="control-group">
                        <h3>外观设置</h3>
                        <label for="bg-color">背景色:</label>
                        <input type="color" id="bg-color" value="#667eea">
                        
                        <label for="text-color">文字颜色:</label>
                        <input type="color" id="text-color" value="#ffffff">
                    </div>
                </div>

                <div class="preview">
                    <h3>预览效果</h3>
                    <div class="card-preview" id="card-preview">
                        <div style="padding: 20px; height: 100%; display: flex; flex-direction: column; justify-content: space-between;">
                            <div>
                                <h2 id="preview-name" style="margin: 0; color: white;">示例卡片</h2>
                                <p id="preview-type" style="margin: 5px 0; opacity: 0.8; color: white;">普通</p>
                            </div>
                            <div style="text-align: center; color: white;">
                                <div>攻击: <span id="preview-attack">100</span></div>
                                <div>防御: <span id="preview-defense">80</span></div>
                                <div>速度: <span id="preview-speed">90</span></div>
                            </div>
                        </div>
                    </div>
                    <button onclick="exportCard()" style="margin-top: 20px;">导出卡片</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tokenInput = document.getElementById('token-input');
        const verifyBtn = document.getElementById('verify-btn');
        const authStatus = document.getElementById('auth-status');
        const mainContent = document.getElementById('main-content');

        let isAuthenticated = false;

        // 验证token函数
        async function verifyToken() {
            const token = tokenInput.value.trim();
            if (!token) {
                showAuthStatus('请输入Token', 'error');
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.textContent = '验证中...';

            try {
                const response = await fetch('https://api.riv62hjux.nyat.app:43419/api/v1/nkey/validate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        nkey: token,
                        app_id: 'CardPreview'
                    })
                });

                const result = await response.json();

                if (response.ok && result.code === 200 && result.data.valid) {
                    isAuthenticated = true;
                    showAuthStatus(`验证成功！欢迎，${result.data.username}`, 'success');
                    mainContent.classList.add('authenticated');
                } else {
                    isAuthenticated = false;
                    showAuthStatus(result.message || 'Token验证失败', 'error');
                    mainContent.classList.remove('authenticated');
                }
            } catch (error) {
                isAuthenticated = false;
                showAuthStatus('网络错误，请检查服务器连接', 'error');
                mainContent.classList.remove('authenticated');
            }

            verifyBtn.disabled = false;
            verifyBtn.textContent = '验证';
        }

        // 显示验证状态
        function showAuthStatus(message, type) {
            authStatus.textContent = message;
            authStatus.className = `auth-status ${type}`;
            authStatus.style.display = 'block';
        }

        // 绑定验证按钮事件
        verifyBtn.addEventListener('click', verifyToken);

        // Token输入框回车验证
        tokenInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                verifyToken();
            }
        });

        // 页面加载时自动检查URL中的nkey参数
        function autoVerifyFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const nkey = urlParams.get('nkey');
            
            if (nkey) {
                tokenInput.value = nkey;
                verifyToken();
            }
        }

        // 更新预览
        function updatePreview() {
            if (!isAuthenticated) return;
            
            const name = document.getElementById('card-name').value;
            const type = document.getElementById('card-type').value;
            const attack = document.getElementById('attack').value;
            const defense = document.getElementById('defense').value;
            const speed = document.getElementById('speed').value;
            const bgColor = document.getElementById('bg-color').value;
            const textColor = document.getElementById('text-color').value;

            const preview = document.getElementById('card-preview');
            const previewName = document.getElementById('preview-name');
            const previewType = document.getElementById('preview-type');
            const previewAttack = document.getElementById('preview-attack');
            const previewDefense = document.getElementById('preview-defense');
            const previewSpeed = document.getElementById('preview-speed');

            preview.style.background = `linear-gradient(135deg, ${bgColor}, ${adjustColor(bgColor, -30)})`;
            previewName.textContent = name || '示例卡片';
            previewName.style.color = textColor;
            previewType.textContent = type;
            previewType.style.color = textColor;
            previewAttack.textContent = attack;
            previewDefense.textContent = defense;
            previewSpeed.textContent = speed;

            const statElements = [previewAttack.parentElement, previewDefense.parentElement, previewSpeed.parentElement];
            statElements.forEach(el => el.style.color = textColor);
        }

        // 调整颜色亮度
        function adjustColor(color, amount) {
            const usePound = color[0] === '#';
            const col = usePound ? color.slice(1) : color;
            const num = parseInt(col, 16);
            let r = (num >> 16) + amount;
            let b = (num >> 8 & 0x00FF) + amount;
            let g = (num & 0x0000FF) + amount;
            r = r > 255 ? 255 : r < 0 ? 0 : r;
            b = b > 255 ? 255 : b < 0 ? 0 : b;
            g = g > 255 ? 255 : g < 0 ? 0 : g;
            return (usePound ? '#' : '') + String('000000' + (g | (b << 8) | (r << 16)).toString(16)).slice(-6);
        }

        // 导出卡片
        function exportCard() {
            if (!isAuthenticated) {
                alert('请先验证身份');
                return;
            }
            
            const cardData = {
                name: document.getElementById('card-name').value,
                type: document.getElementById('card-type').value,
                attack: document.getElementById('attack').value,
                defense: document.getElementById('defense').value,
                speed: document.getElementById('speed').value,
                bgColor: document.getElementById('bg-color').value,
                textColor: document.getElementById('text-color').value
            };
            
            const blob = new Blob([JSON.stringify(cardData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${cardData.name || 'card'}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 绑定所有输入元素的change事件
        document.addEventListener('DOMContentLoaded', () => {
            autoVerifyFromURL();
            
            const inputs = ['card-name', 'card-type', 'attack', 'defense', 'speed', 'bg-color', 'text-color'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', updatePreview);
            });
            
            updatePreview();
        });
    </script>
</body>
</html>
