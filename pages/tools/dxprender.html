<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图片渲染器</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }
    .container {
      display: flex;
      height: 100vh;
    }
    .controls {
      width: 320px;
      background: #fff;
      padding: 32px 24px;
      box-shadow: 2px 0 8px #0001;
      display: flex;
      flex-direction: column;
      gap: 24px;
      justify-content: center;
    }
    .controls label {
      font-weight: bold;
      margin-bottom: 4px;
      display: block;
    }
    .controls input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
    }
    .controls input:disabled {
      background: #f5f5f5;
      color: #999;
      cursor: not-allowed;
    }
    .auth-section {
      border-bottom: 1px solid #eee;
      padding-bottom: 24px;
      margin-bottom: 8px;
    }
    .auth-controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .auth-controls input {
      flex: 1;
    }
    .auth-controls button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      background: #007acc;
      color: white;
    }
    .auth-controls button:hover {
      background: #005a9e;
    }
    .auth-controls button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .auth-status {
      margin-top: 8px;
      padding: 8px;
      border-radius: 4px;
      font-size: 14px;
    }
    .auth-status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .auth-status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .preview {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e0e0e0;
    }
    .render-area {
      position: relative;
      width: 400px;
      height: 600px;
      background: #fff;
      box-shadow: 0 0 16px #0002;
      border-radius: 12px;
      overflow: hidden;
    }
    .render-area img {
      position: absolute;
      left: 0; top: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="controls">
      <div>
        <label for="bg-url">底图链接</label>
        <input id="bg-url" type="text" placeholder="输入背景图片URL" value="http://localhost:5174/api/v1/jacket/maimai2/Card/UI_CardBase_0000002_000002_S">
      </div>
      <div>
        <label for="char-url">角色图片链接</label>
        <input id="char-url" type="text" placeholder="输入角色图片URL" value="/segaassets/maimai2/Card/UI_CardChara_250404_S.png">
      </div>
      <div>
        <label for="mask-url">pass种类</label>
        <input id="mask-url" type="text" placeholder="输入遮罩图片URL" value="/segaassets/maimai2/Card/UI_CardFrame_0000002_S.png">
      </div>
    </div>
    <div class="preview">
      <div class="render-area">
        <img id="bg-img" src="http://localhost:5174/api/v1/jacket/maimai2/Card/UI_CardBase_0000002_000002_S" alt="背景">
        <img id="char-img" src="/segaassets/maimai2/Card/UI_CardChara_250404_S.png" alt="角色">
        <img id="mask-img" src="/segaassets/maimai2/Card/UI_CardFrame_0000002_S.png" alt="遮罩">
        <!-- 虽然看起来这个锁有点儿防君子不防小人，但其实只要我把资源锁住就可以了 -->
        <!-- 但仍然可以外链 -->
      </div>
    </div>
  </div>
  <script>
    const bgInput = document.getElementById('bg-url');
    const charInput = document.getElementById('char-url');
    const maskInput = document.getElementById('mask-url');
    const bgImg = document.getElementById('bg-img');
    const charImg = document.getElementById('char-img');
    const maskImg = document.getElementById('mask-img');
    // 图片链接更新事件（实时生效）
    bgInput.addEventListener('input', () => {
      bgImg.src = bgInput.value;
    });
    charInput.addEventListener('input', () => {
      charImg.src = charInput.value;
    });
    maskInput.addEventListener('input', () => {
      maskImg.src = maskInput.value;
    });
  </script>
</body>
</html>
